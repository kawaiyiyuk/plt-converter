services:
  plt-converter:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PLT_PIP_INDEX_URL:-https://mirrors.cloud.tencent.com/pypi/simple}
    container_name: plt_converter
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      PORT: 80
      PLT_MAX_UPLOAD_MB: 20
      REDIS_URL: redis://redis:6379/0
      PLT_QUEUE_MAX_PENDING: 20
      PLT_JOB_TIMEOUT_SECONDS: 90
      PLT_JOB_RETENTION_SECONDS: 1800
      PLT_RATE_LIMIT_PER_MINUTE: 3
      PLT_USER_MAX_ACTIVE_JOBS: 2
      PLT_MAX_POINTS: 500000
      PLT_MAX_PATHS: 100000
      PLT_MAX_OUTPUT_PAGES: 80
      PLT_MAX_DIMENSION_MM: 10000
      PLT_MAX_COMMANDS: 250000
      PLT_MAX_TEXT_CHARS: 100000
      PDF_MAX_TOTAL_PIXELS: 200000000
      PDF_MAX_DRAWINGS: 250000
      PDF_MAX_OUTPUT_SEGMENTS: 300000
      PLT_PREVIEW_RATE_LIMIT_PER_MINUTE: 12
      PLT_UPLOAD_RATE_LIMIT_PER_MINUTE: 10
      PLT_UPLOAD_IP_RATE_LIMIT_PER_MINUTE: 30
      PLT_METRICS_TOKEN: ${PLT_METRICS_TOKEN:-}
      WX_BACKEND_URL: ${WX_BACKEND_URL:-http://host.docker.internal:5001}
      CONVERSION_SERVICE_TOKEN: ${CONVERSION_SERVICE_TOKEN:-development-conversion-service-token}
    ports:
      - "8091:80"
    volumes:
      - converter-temp:/tmp/plt-converter
    mem_limit: 1g
    cpus: 1.0
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  plt-worker:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PLT_PIP_INDEX_URL:-https://mirrors.cloud.tencent.com/pypi/simple}
    container_name: plt_converter_worker
    restart: unless-stopped
    command: ["python", "worker.py"]
    environment:
      REDIS_URL: redis://redis:6379/0
      PLT_TEMP_FOLDER: /tmp/plt-converter
      PLT_QUEUE_MAX_PENDING: 20
      PLT_JOB_TIMEOUT_SECONDS: 90
      PLT_JOB_RETENTION_SECONDS: 1800
      PLT_MAX_POINTS: 500000
      PLT_MAX_PATHS: 100000
      PLT_MAX_OUTPUT_PAGES: 80
      PLT_MAX_DIMENSION_MM: 10000
      PLT_MAX_COMMANDS: 250000
      PLT_MAX_TEXT_CHARS: 100000
      PDF_MAX_TOTAL_PIXELS: 200000000
      PDF_MAX_DRAWINGS: 250000
      PDF_MAX_OUTPUT_SEGMENTS: 300000
      WX_BACKEND_URL: ${WX_BACKEND_URL:-http://host.docker.internal:5001}
      CONVERSION_SERVICE_TOKEN: ${CONVERSION_SERVICE_TOKEN:-development-conversion-service-token}
    volumes:
      - converter-temp:/tmp/plt-converter
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 1g
    cpus: 1.0

  redis:
    image: redis:7-alpine
    container_name: plt_converter_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

volumes:
  converter-temp:
  redis-data:
